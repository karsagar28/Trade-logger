<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trade Logger</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0c0c0e;
      --surface: #16161a;
      --surface2:#1e1e24;
      --border:  #2a2a35;
      --text:    #ebebf0;
      --muted:   #6b6b80;
      --accent:  #00d4aa;
      --win:     #00d4aa;
      --loss:    #ff4757;
      --shares:  #3b82f6;
      --options: #a855f7;
      --font:    -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--muted);
    }
    .gear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    /* ── Setup banner ── */
    .setup-banner {
      background: rgba(0,212,170,0.07);
      border: 1px solid rgba(0,212,170,0.22);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .setup-banner p { font-size: 13px; color: var(--muted); margin-bottom: 10px; line-height: 1.5; }
    .url-row { display: flex; gap: 8px; }
    .url-row input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      outline: none;
    }
    .url-row input:focus { border-color: var(--accent); }
    .url-row button {
      background: var(--accent); color: #000; border: none;
      padding: 9px 14px; border-radius: 8px;
      font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
    }

    /* ── Stats ── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 8px;
    }
    .stats-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat { background: var(--surface); border-radius: 10px; padding: 12px 8px; text-align: center; }
    .stat-val { font-size: 22px; font-weight: 700; line-height: 1; margin-bottom: 5px; }
    .stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }

    /* ── Card ── */
    .card { background: var(--surface); border-radius: 12px; margin-bottom: 16px; overflow: hidden; }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
    }
    .card-header span {
      font-size: 11px; font-weight: 600;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px;
    }
    .chevron { color: var(--muted); font-size: 14px; transition: transform 0.2s; }
    .chevron.open { transform: rotate(180deg); }
    .card-body { padding: 0 14px 14px; }

    /* ── Form ── */
    .form-grid { display: grid; gap: 10px; }
    .row-2 { grid-template-columns: 1fr 1fr; }

    .field label {
      display: block; font-size: 10px; font-weight: 600;
      color: var(--muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 6px;
    }
    .field label .opt { font-weight: 400; text-transform: none; letter-spacing: 0; }

    input[type=text], input[type=number], select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 16px;
      font-family: var(--font);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }
    input:focus, select:focus { border-color: var(--accent); }
    select {
      background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b6b80' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 16px;
      padding-right: 32px;
    }

    /* ── Type toggle ── */
    .toggle {
      display: flex;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 3px; gap: 3px; height: 44px;
    }
    .toggle-btn {
      flex: 1; background: none; border: none; border-radius: 6px;
      color: var(--muted); font-size: 13px; font-weight: 600;
      font-family: var(--font); cursor: pointer; transition: all 0.15s ease;
    }
    .active-shares  { background: var(--shares)  !important; color: #fff !important; }
    .active-options { background: var(--options) !important; color: #fff !important; }

    /* ── R suffix ── */
    .r-wrap { position: relative; }
    .r-wrap input { padding-right: 28px; }
    .r-suffix {
      position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 13px; font-weight: 600; pointer-events: none;
    }

    /* ── Submit ── */
    .btn-log {
      width: 100%; padding: 13px; background: var(--accent); color: #000;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 800;
      font-family: var(--font); letter-spacing: 1.5px; cursor: pointer;
      margin-top: 2px; transition: opacity 0.15s;
    }
    .btn-log:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Log section ── */
    .log-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    }
    .log-header span {
      font-size: 11px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600;
    }
    .refresh-btn { background: none; border: none; color: var(--muted); font-size: 13px; cursor: pointer; padding: 2px 6px; }

    /* ── Trade item ── */
    .trade-list { display: flex; flex-direction: column; gap: 6px; }
    .trade {
      background: var(--surface); border-radius: 10px;
      padding: 12px 14px; display: flex; align-items: center;
      justify-content: space-between; cursor: pointer; transition: background 0.12s;
    }
    .trade:active { background: var(--surface2); }
    .trade-top { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
    .ticker { font-size: 16px; font-weight: 700; letter-spacing: 0.3px; }
    .badge {
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-shares  { background: rgba(59,130,246,0.15); color: var(--shares); }
    .badge-options { background: rgba(168,85,247,0.15); color: var(--options); }
    .trade-meta { font-size: 11px; color: var(--muted); line-height: 1.5; }
    .trade-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
    .trade-result { font-size: 20px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
    .result-win  { color: var(--win); }
    .result-loss { color: var(--loss); }
    .result-even { color: var(--muted); }
    .result-open {
      font-size: 11px; font-weight: 700; color: var(--muted);
      background: rgba(107,107,128,0.15); padding: 4px 8px;
      border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; display: inline-block;
    }
    .trade-risk-lbl { font-size: 11px; color: var(--muted); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 14px; }

    /* ── Bottom sheet ── */
    .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 200; }
    .bottom-sheet {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 480px; background: var(--surface);
      border-radius: 16px 16px 0 0; padding: 12px 16px 32px;
      z-index: 201; max-height: 90vh; overflow-y: auto;
    }
    .sheet-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 14px; }
    .sheet-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .sheet-header span { font-size: 14px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 18px; cursor: pointer; padding: 2px 6px; line-height: 1; }

    /* ── Delete zone ── */
    .delete-zone { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
    .btn-delete {
      width: 100%; padding: 12px; background: none;
      border: 1px solid rgba(255,71,87,0.4); color: var(--loss);
      border-radius: 8px; font-size: 14px; font-weight: 600;
      font-family: var(--font); cursor: pointer; transition: all 0.15s;
    }
    .btn-delete:hover { background: rgba(255,71,87,0.08); }
    .delete-confirm-text { font-size: 13px; color: var(--muted); margin-bottom: 10px; text-align: center; }
    .confirm-row { display: flex; gap: 8px; }
    .btn-cancel { flex: 1; padding: 11px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-size: 14px; font-family: var(--font); cursor: pointer; }
    .btn-confirm-del { flex: 1; padding: 11px; background: var(--loss); border: none; color: #fff; border-radius: 8px; font-size: 14px; font-weight: 700; font-family: var(--font); cursor: pointer; }
    .btn-confirm-del:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--accent); color: #000;
      padding: 10px 18px; border-radius: 20px;
      font-size: 13px; font-weight: 700; font-family: var(--font);
      opacity: 0; transition: all 0.25s ease;
      pointer-events: none; white-space: nowrap; z-index: 300;
    }
    .toast.show  { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--loss); color: #fff; }
  </style>
</head>
<body>

<header>
  <h1>Trade Logger</h1>
  <button class="gear-btn" onclick="toggleSetup()" title="Settings">⚙</button>
</header>

<!-- URL config -->
<div class="setup-banner" id="setup" style="display:none">
  <p>Paste your Google Apps Script deployment URL to connect to your sheet.</p>
  <div class="url-row">
    <input type="url" id="urlInput" placeholder="https://script.google.com/macros/s/..." />
    <button onclick="saveUrl()">Save</button>
  </div>
</div>

<!-- Stats -->
<div class="stats">
  <div class="stat"><div class="stat-val" id="s-trades">—</div><div class="stat-lbl">Trades</div></div>
  <div class="stat"><div class="stat-val" id="s-winrate">—</div><div class="stat-lbl">Win Rate</div></div>
  <div class="stat"><div class="stat-val" id="s-avgr">—</div><div class="stat-lbl">Avg R</div></div>
</div>
<div class="stats-2">
  <div class="stat"><div class="stat-val" id="s-risked">—</div><div class="stat-lbl">R Risked</div></div>
  <div class="stat"><div class="stat-val" id="s-returned">—</div><div class="stat-lbl">R Returned</div></div>
</div>

<!-- Log form (collapsible) -->
<div class="card">
  <div class="card-header" onclick="toggleForm()">
    <span>New Trade</span>
    <span class="chevron open" id="form-chevron">▾</span>
  </div>
  <div class="card-body" id="form-body">
    <div class="form-grid">

      <div class="form-grid row-2">
        <div class="field">
          <label>Ticker</label>
          <input type="text" id="f-ticker" placeholder="AAPL"
                 autocomplete="off" autocapitalize="characters" maxlength="10" />
        </div>
        <div class="field">
          <label>Type</label>
          <div class="toggle">
            <button class="toggle-btn active-shares" id="btn-shares" onclick="setType('shares')">Shares</button>
            <button class="toggle-btn" id="btn-options" onclick="setType('options')">Options</button>
          </div>
        </div>
      </div>

      <div class="form-grid row-2">
        <div class="field">
          <label>Risk</label>
          <div class="r-wrap">
            <input type="number" id="f-risk" placeholder="1" step="0.25" min="0.25" />
            <span class="r-suffix">R</span>
          </div>
        </div>
        <div class="field">
          <label>Stop Type</label>
          <select id="f-stop">
            <option value="">Select…</option>
            <option value="Mental Stop">Mental Stop</option>
            <option value="Low of Day">Low of Day</option>
            <option value="Pivot Low">Pivot Low</option>
            <option value="Break Even">Break Even</option>
            <option value="Manual Stop">Manual Stop</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Close Type <span class="opt">— optional</span></label>
        <select id="f-close" onchange="onCloseTypeChange('f')">
          <option value="">Select…</option>
          <option value="Stop Hit">Stop Hit</option>
          <option value="Manual Close">Manual Close</option>
        </select>
      </div>

      <div class="field" id="f-reason-row" style="display:none">
        <label>Reason</label>
        <select id="f-reason">
          <option value="">Select…</option>
          <option value="Panic">Panic</option>
          <option value="Change of Mind">Change of Mind</option>
          <option value="Made in Error">Made in Error</option>
        </select>
      </div>

      <div class="field">
        <label>Result <span class="opt">— optional · negative = loss · 0 = breakeven</span></label>
        <div class="r-wrap">
          <input type="number" id="f-result" placeholder="e.g. 2 or -1" step="0.25" />
          <span class="r-suffix">R</span>
        </div>
      </div>

      <button class="btn-log" id="btn-log" onclick="logTrade()">LOG TRADE</button>

    </div>
  </div>
</div>

<!-- Trade log -->
<div class="log-header">
  <span>Log</span>
  <button class="refresh-btn" onclick="loadTrades()">↻ Refresh</button>
</div>
<div class="trade-list" id="trade-list">
  <div class="empty-state">Loading…</div>
</div>

<!-- Edit bottom sheet -->
<div class="overlay" id="overlay" onclick="closeEdit()" style="display:none"></div>
<div class="bottom-sheet" id="bottom-sheet" style="display:none">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span>Edit Trade</span>
    <button class="close-btn" onclick="closeEdit()">✕</button>
  </div>
  <div class="form-grid">

    <div class="form-grid row-2">
      <div class="field">
        <label>Ticker</label>
        <input type="text" id="e-ticker" autocomplete="off" autocapitalize="characters" maxlength="10" />
      </div>
      <div class="field">
        <label>Type</label>
        <div class="toggle">
          <button class="toggle-btn" id="e-btn-shares" onclick="setEditType('shares')">Shares</button>
          <button class="toggle-btn" id="e-btn-options" onclick="setEditType('options')">Options</button>
        </div>
      </div>
    </div>

    <div class="form-grid row-2">
      <div class="field">
        <label>Risk</label>
        <div class="r-wrap">
          <input type="number" id="e-risk" step="0.25" min="0.25" />
          <span class="r-suffix">R</span>
        </div>
      </div>
      <div class="field">
        <label>Stop Type</label>
        <select id="e-stop">
          <option value="">Select…</option>
          <option value="Mental Stop">Mental Stop</option>
          <option value="Low of Day">Low of Day</option>
          <option value="Pivot Low">Pivot Low</option>
          <option value="Break Even">Break Even</option>
          <option value="Manual Stop">Manual Stop</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label>Close Type <span class="opt">— optional</span></label>
      <select id="e-close" onchange="onCloseTypeChange('e')">
        <option value="">Select…</option>
        <option value="Stop Hit">Stop Hit</option>
        <option value="Manual Close">Manual Close</option>
      </select>
    </div>

    <div class="field" id="e-reason-row" style="display:none">
      <label>Reason</label>
      <select id="e-reason">
        <option value="">Select…</option>
        <option value="Panic">Panic</option>
        <option value="Change of Mind">Change of Mind</option>
        <option value="Made in Error">Made in Error</option>
      </select>
    </div>

    <div class="field">
      <label>Result <span class="opt">— optional</span></label>
      <div class="r-wrap">
        <input type="number" id="e-result" placeholder="Leave blank if still open" step="0.25" />
        <span class="r-suffix">R</span>
      </div>
    </div>

    <button class="btn-log" id="btn-update" onclick="submitEdit()">UPDATE TRADE</button>

    <!-- Delete -->
    <div class="delete-zone">
      <button class="btn-delete" id="btn-delete" onclick="showDeleteConfirm()">Delete Entry</button>
      <div id="delete-confirm" style="display:none">
        <p class="delete-confirm-text">Permanently delete this trade?</p>
        <div class="confirm-row">
          <button class="btn-cancel" onclick="hideDeleteConfirm()">Cancel</button>
          <button class="btn-confirm-del" id="btn-confirm-del" onclick="executeDelete()">Delete</button>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let tradeType     = 'shares';
  let editType      = 'shares';
  let editRow       = null;
  let currentTrades = [];
  let scriptUrl     = localStorage.getItem('tradeLoggerUrl') || '';

  /* ── Init ── */
  function init() {
    if (!scriptUrl) {
      document.getElementById('setup').style.display = 'block';
      setEmpty('Enter your Apps Script URL in settings (⚙) to get started.');
      setStats([]);
    } else {
      loadTrades();
    }
  }

  /* ── Settings ── */
  function toggleSetup() {
    const el = document.getElementById('setup');
    const hidden = el.style.display === 'none';
    el.style.display = hidden ? 'block' : 'none';
    if (hidden && scriptUrl) document.getElementById('urlInput').value = scriptUrl;
  }

  function saveUrl() {
    const url = document.getElementById('urlInput').value.trim();
    if (!url.startsWith('https://script.google.com')) {
      toast('Paste a valid Apps Script URL', true); return;
    }
    scriptUrl = url;
    localStorage.setItem('tradeLoggerUrl', url);
    document.getElementById('setup').style.display = 'none';
    toast('Connected!');
    loadTrades();
  }

  /* ── Collapsible form ── */
  function toggleForm() {
    const body    = document.getElementById('form-body');
    const chevron = document.getElementById('form-chevron');
    const isOpen  = body.style.display !== 'none';
    body.style.display = isOpen ? 'none' : 'block';
    chevron.className  = 'chevron' + (isOpen ? '' : ' open');
  }

  /* ── Close type / reason visibility ── */
  function onCloseTypeChange(prefix) {
    const isManual = document.getElementById(prefix + '-close').value === 'Manual Close';
    document.getElementById(prefix + '-reason-row').style.display = isManual ? 'block' : 'none';
    if (!isManual) document.getElementById(prefix + '-reason').value = '';
  }

  /* ── Add form ── */
  function setType(type) {
    tradeType = type;
    document.getElementById('btn-shares').className  = 'toggle-btn' + (type === 'shares'  ? ' active-shares'  : '');
    document.getElementById('btn-options').className = 'toggle-btn' + (type === 'options' ? ' active-options' : '');
  }

  async function logTrade() {
    const ticker = document.getElementById('f-ticker').value.trim().toUpperCase();
    const risk   = document.getElementById('f-risk').value.trim();
    const stop   = document.getElementById('f-stop').value;
    const close  = document.getElementById('f-close').value;
    const reason = document.getElementById('f-reason').value;
    const result = document.getElementById('f-result').value.trim();

    if (!ticker || !risk || !stop) {
      toast('Ticker, risk and stop are required', true); return;
    }
    if (!scriptUrl) { toast('Set your Apps Script URL first', true); toggleSetup(); return; }

    const btn = document.getElementById('btn-log');
    btn.disabled = true; btn.textContent = 'Logging…';

    try {
      const params = new URLSearchParams({
        action: 'add', ticker, type: tradeType, risk,
        stopType: stop, closeType: close, reason, result
      });
      const res  = await fetch(`${scriptUrl}?${params}`);
      const data = await res.json();
      if (data.success) {
        toast('Trade logged!');
        ['f-ticker','f-risk','f-result'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('f-stop').value  = '';
        document.getElementById('f-close').value = '';
        document.getElementById('f-reason').value = '';
        document.getElementById('f-reason-row').style.display = 'none';
        loadTrades();
      } else {
        toast(data.error || 'Error logging trade', true);
      }
    } catch (err) {
      toast('Connection failed — check URL', true); console.error(err);
    } finally {
      btn.disabled = false; btn.textContent = 'LOG TRADE';
    }
  }

  /* ── Load & render ── */
  async function loadTrades() {
    if (!scriptUrl) return;
    try {
      const res    = await fetch(`${scriptUrl}?action=get`);
      const trades = await res.json();
      if (!Array.isArray(trades)) throw new Error('Bad response');
      currentTrades = [...trades].reverse();
      setStats(trades);
      renderTrades(currentTrades);
    } catch (err) {
      setEmpty('Could not load trades. Check your Apps Script URL.');
      console.error(err);
    }
  }

  function renderTrades(trades) {
    const el = document.getElementById('trade-list');
    if (!trades.length) {
      el.innerHTML = '<div class="empty-state">No trades logged yet.</div>'; return;
    }
    el.innerHTML = trades.map((t, i) => {
      const resultStr = String(t.result ?? '').trim();
      const r         = parseFloat(resultStr);
      const isOpen    = !resultStr || isNaN(r);
      const cls       = isOpen ? '' : r > 0 ? 'result-win' : r < 0 ? 'result-loss' : 'result-even';
      const badge     = t.type === 'shares' ? 'badge-shares' : 'badge-options';

      const rDisp = isOpen
        ? '<span class="result-open">Open</span>'
        : `<div class="trade-result ${cls}">${r > 0 ? '+' : ''}${r}R</div>`;

      let meta = t.date || '';
      if (t.stopType)  meta += (meta ? ' · ' : '') + t.stopType;
      if (t.closeType) meta += (meta ? ' · ' : '') + t.closeType;
      if (t.reason)    meta += ' — ' + t.reason;

      return `
        <div class="trade" onclick="openEdit(${i})">
          <div style="min-width:0">
            <div class="trade-top">
              <span class="ticker">${t.ticker}</span>
              <span class="badge ${badge}">${t.type}</span>
            </div>
            <div class="trade-meta">${meta}</div>
          </div>
          <div class="trade-right">
            ${rDisp}
            <div class="trade-risk-lbl">${t.risk} risk</div>
          </div>
        </div>`;
    }).join('');
  }

  /* ── Stats ── */
  function setStats(trades) {
    const results = trades
      .map(t => parseFloat(String(t.result ?? '')))
      .filter(n => !isNaN(n));

    const risks = trades
      .map(t => parseFloat(String(t.risk ?? '')))
      .filter(n => !isNaN(n));

    document.getElementById('s-trades').textContent = trades.length || '0';

    // R Risked — sum of all risk values across every trade
    const totalRisked = risks.reduce((a, b) => a + b, 0);
    document.getElementById('s-risked').textContent = risks.length ? totalRisked.toFixed(2) + 'R' : '—';

    // R Returned — sum of results for closed trades only
    const totalReturned = results.reduce((a, b) => a + b, 0);
    const retEl = document.getElementById('s-returned');
    if (!results.length) {
      retEl.textContent  = '—';
      retEl.style.color  = '';
    } else {
      retEl.textContent  = (totalReturned >= 0 ? '+' : '') + totalReturned.toFixed(2) + 'R';
      retEl.style.color  = totalReturned > 0 ? 'var(--win)' : totalReturned < 0 ? 'var(--loss)' : '';
    }

    if (!results.length) {
      document.getElementById('s-winrate').textContent = '—';
      document.getElementById('s-avgr').textContent    = '—';
      document.getElementById('s-avgr').style.color    = '';
      return;
    }

    const wins = results.filter(r => r > 0).length;
    const wr   = Math.round((wins / results.length) * 100);
    const avg  = results.reduce((a, b) => a + b, 0) / results.length;

    document.getElementById('s-winrate').textContent = wr + '%';
    const avgEl = document.getElementById('s-avgr');
    avgEl.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2) + 'R';
    avgEl.style.color = avg > 0 ? 'var(--win)' : avg < 0 ? 'var(--loss)' : '';
  }

  /* ── Edit sheet ── */
  function openEdit(index) {
    const t = currentTrades[index];
    if (!t) return;
    editRow = t.row;

    document.getElementById('e-ticker').value = t.ticker;
    setEditType(t.type || 'shares');
    document.getElementById('e-risk').value  = parseFloat(t.risk) || '';
    document.getElementById('e-stop').value  = t.stopType  || '';
    document.getElementById('e-close').value = t.closeType || '';
    onCloseTypeChange('e');
    document.getElementById('e-reason').value = t.reason || '';
    const r = parseFloat(String(t.result ?? ''));
    document.getElementById('e-result').value = isNaN(r) ? '' : r;

    hideDeleteConfirm();
    document.getElementById('overlay').style.display      = 'block';
    document.getElementById('bottom-sheet').style.display = 'block';
  }

  function closeEdit() {
    document.getElementById('overlay').style.display      = 'none';
    document.getElementById('bottom-sheet').style.display = 'none';
    editRow = null;
  }

  function setEditType(type) {
    editType = type;
    document.getElementById('e-btn-shares').className  = 'toggle-btn' + (type === 'shares'  ? ' active-shares'  : '');
    document.getElementById('e-btn-options').className = 'toggle-btn' + (type === 'options' ? ' active-options' : '');
  }

  async function submitEdit() {
    const ticker = document.getElementById('e-ticker').value.trim().toUpperCase();
    const risk   = document.getElementById('e-risk').value.trim();
    const stop   = document.getElementById('e-stop').value;
    const close  = document.getElementById('e-close').value;
    const reason = document.getElementById('e-reason').value;
    const result = document.getElementById('e-result').value.trim();

    if (!ticker || !risk || !stop) { toast('Ticker, risk and stop are required', true); return; }
    if (!editRow) return;

    const btn = document.getElementById('btn-update');
    btn.disabled = true; btn.textContent = 'Updating…';

    try {
      const params = new URLSearchParams({
        action: 'update', row: editRow, ticker, type: editType,
        risk, stopType: stop, closeType: close, reason, result
      });
      const res  = await fetch(`${scriptUrl}?${params}`);
      const data = await res.json();
      if (data.success) {
        toast('Trade updated!'); closeEdit(); loadTrades();
      } else {
        toast(data.error || 'Error updating', true);
      }
    } catch (err) {
      toast('Connection failed', true); console.error(err);
    } finally {
      btn.disabled = false; btn.textContent = 'UPDATE TRADE';
    }
  }

  /* ── Delete ── */
  function showDeleteConfirm() {
    document.getElementById('btn-delete').style.display      = 'none';
    document.getElementById('delete-confirm').style.display  = 'block';
  }

  function hideDeleteConfirm() {
    document.getElementById('btn-delete').style.display      = 'block';
    document.getElementById('delete-confirm').style.display  = 'none';
  }

  async function executeDelete() {
    if (!editRow) return;
    const btn = document.getElementById('btn-confirm-del');
    btn.disabled = true; btn.textContent = 'Deleting…';

    try {
      const params = new URLSearchParams({ action: 'delete', row: editRow });
      const res  = await fetch(`${scriptUrl}?${params}`);
      const data = await res.json();
      if (data.success) {
        toast('Trade deleted'); closeEdit(); loadTrades();
      } else {
        toast(data.error || 'Error deleting', true); hideDeleteConfirm();
      }
    } catch (err) {
      toast('Connection failed', true); hideDeleteConfirm();
    } finally {
      btn.disabled = false; btn.textContent = 'Delete';
    }
  }

  /* ── Helpers ── */
  function setEmpty(msg) {
    document.getElementById('trade-list').innerHTML = `<div class="empty-state">${msg}</div>`;
  }

  function toast(msg, isError = false) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = 'toast show' + (isError ? ' error' : '');
    setTimeout(() => el.className = 'toast', 2500);
  }

  init();
</script>
</body>
</html>
